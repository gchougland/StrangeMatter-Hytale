research.name=Research
research.description=Introduction to the research machine and how to unlock new technologies through anomaly study.
field_scanner.name=Field Scanner
field_scanner.description=A handheld device for detecting and analyzing anomalies in the field.
anomaly_resonator.name=Anomaly Resonator
anomaly_resonator.description=An advanced compass-like device that points toward nearby anomalies and allows synchronization.
anomaly_shards.name=Anomaly Shards
anomaly_shards.description=Understanding the different types of anomaly shards and their generation in the world.
anomaly_types.name=Anomaly Types
anomaly_types.description=Comprehensive understanding of the six fundamental types of anomalies and their properties.
resonite.name=Resonite
resonite.description=The fundamental energy source derived from anomalies. Learn to collect and process resonite ore.
resonance_condenser.name=Resonance Condenser
resonance_condenser.description=An advanced machine that condenses anomaly energy into crystallized shards for advanced crafting.
tinfoil_hat.name=Tinfoil Hat
tinfoil_hat.description=A protective helmet crafted from resonite that shields the mind from cognitive anomalies and deflects electrical energy.
levitation_pad.name=Levitation Pad
levitation_pad.description=An advanced device that creates controlled levitation fields for safe transportation and anti-gravity applications.
resonant_energy.name=Resonant Energy Fundamentals
resonant_energy.description=Generate Resonant Energy from fuel, store a reserve, route it through conduits and recharge your gadgets. Unlocks the burner, energy storage, conduits and charging station.
containment_basics.name=Containment Basics
containment_basics.description=Fundamental principles of anomaly containment using Echo Vacuum and Containment Capsules.
echoform_imprinter.name=Echoform Imprinter
echoform_imprinter.description=A revolutionary device that scans and mimics the physical forms of living entities through shadow-cognitive resonance.
reality_forge.name=Reality Forge
reality_forge.description=The ultimate crafting machine that uses anomaly shards to create powerful and exotic items.
reality_forge_category.name=Reality Forge
reality_forge_category.description=The ultimate crafting machine that uses anomaly shards to create powerful and exotic items.
warp_gun.name=Warp Gun
warp_gun.description=A powerful weapon that shoots projectiles creating temporary mini warp gates.
chrono_blister.name=Chrono Blister
chrono_blister.description=A temporal gadget that shoots projectiles spawning time dilation blocks, slowing all movement through them.
stasis_projector.name=Stasis Projector
stasis_projector.description=An advanced device that manipulates gravitational and temporal fields to suspend objects in a frozen state.
rift_stabilizer.name=Rift Stabilizer
rift_stabilizer.description=Harness energetic rifts for power, or build an Anomaly Nullifier to suppress nearby anomaly effects without fuel.
gravity_anomalies.name=Gravity Anomalies
gravity_anomalies.description=In-depth study of gravitational anomalies and their unique physics-defying properties.
temporal_anomalies.name=Temporal Anomalies
temporal_anomalies.description=Advanced research into temporal distortions and time-based anomaly phenomena.
spatial_anomalies.name=Spatial Anomalies
spatial_anomalies.description=Understanding spatial distortions, dimensional rifts, and reality-bending anomalies.
energy_anomalies.name=Energy Anomalies
energy_anomalies.description=Study of energetic rifts and electrical anomaly phenomena that crackle with raw power.
shadow_anomalies.name=Shadow Anomalies
shadow_anomalies.description=Research into shadow-based anomalies and dimensional void phenomena.
cognitive_anomalies.name=Cognitive Anomalies
cognitive_anomalies.description=Understanding thoughtwells and anomaly phenomena that affect mental perception and cognition.
graviton_hammer.name=Graviton Hammer
graviton_hammer.description=A powerful mining tool that manipulates gravitational forces to mine in 3x3 areas and create charged tunnels. Left-click for area mining, right-click and hold to charge up for tunnel mining.
hoverboard.name=Hoverboard
hoverboard.description=A personal transportation device that hovers above the ground using anti-gravity technology.
resonant_separation.name=Resonant Separation
resonant_separation.description=Separate raw ore into twice the normal metal yield.
flux_smelting.name=Flux Smelting
flux_smelting.description=Heat ordinary furnace recipes with resonant energy.
gravitic_transport.name=Gravitic Transport
gravitic_transport.description=Move supplies through carefully controlled gravity fields.
pattern_assembly.name=Pattern Assembly
pattern_assembly.description=Repeat discovered Workbench recipes with stored ingredients.
resonant_battery_pack.name=Resonant Battery Pack
resonant_battery_pack.description=A wearable reserve of Resonant Energy that automatically replenishes inventory gadgets. Occupies the chest equipment slot.
gravitic_manipulation.name=Gravitic Manipulation
gravitic_manipulation.description=Suspend blocks, creatures and intact chests in front of you. Carry them safely or launch them with a focused gravity impulse.
arc_projection.name=Arc Projection
arc_projection.description=Discharge a directed stream of electricity that branches through nearby enemies and briefly slows their advance.
