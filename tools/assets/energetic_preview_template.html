<!doctype html><html lang="en"><meta charset="utf-8"><title>Energetic rift asset preview</title>
<style>html{background:#07101e;color:#d0e5f6;font:16px system-ui}body{max-width:1200px;margin:24px auto;padding:0 20px}h1{font-size:28px;color:#8ffaff;margin:0 0 6px}p{color:#90a7c1;margin:8px 0 20px}canvas{width:100%;border:1px solid #27364e;border-radius:12px;background:#0b1322}button,label{font:inherit;background:#14243b;color:#c1e7fa;border:1px solid #324462;padding:9px 16px;border-radius:8px;margin:12px 12px 0 0}input{vertical-align:middle}small{display:block;color:#8098b5;margin-top:14px}</style>
<h1>Energetic rift</h1><p>Current models and textures. Particle motion is an approximate asset preview.</p>
<canvas id="view" width="1200" height="690"></canvas>
<button id="play">Pause motion</button><label><input id="vfx" type="checkbox" checked> Show field effects</label><label>Core angle <input id="angle" type="range" min="0" max="360" value="25"></label>
<small>The link panels use the native world path and camera facing velocity alignment. They are not captured game frames. No texture or sprite files were changed.</small>
<script>
const DATA=__DATA__,canvas=document.getElementById('view'),ctx=canvas.getContext('2d'),images={},tints=new Map();
const dot=(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0),sub=(a,b)=>a.map((v,i)=>v-b[i]),cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],norm=a=>a.map(v=>v/Math.hypot(...a));
const camera=(yaw,pitch,cx,cy,scale)=>{let cam=[Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),Math.cos(yaw)*Math.cos(pitch)],right=[Math.cos(yaw),0,-Math.sin(yaw)],up=cross(cam,right);return {cam,p:p=>[cx+dot(p,right)*scale,cy-dot(p,up)*scale,dot(p,cam)],scale}};
function tint(key,color){let id=key+color;if(tints.has(id))return tints.get(id);let c=document.createElement('canvas');c.width=c.height=128;let x=c.getContext('2d');x.drawImage(images[key],0,0);x.globalCompositeOperation='source-in';x.fillStyle=color;x.fillRect(0,0,128,128);tints.set(id,c);return c}
function sprite(cam,key,p,w,h,color,alpha,angle=0){let q=cam.p(p);ctx.save();ctx.translate(q[0],q[1]);ctx.rotate(angle);ctx.globalAlpha=alpha;ctx.globalCompositeOperation=key==='debris'?'source-over':'lighter';ctx.drawImage(tint(key,color),-w*cam.scale/2,-h*cam.scale/2,w*cam.scale,h*cam.scale);ctx.restore()}
function tri(img,p,u){let [a,b,c]=u,[A,B,C]=p,d=(b[0]-a[0])*(c[1]-a[1])-(c[0]-a[0])*(b[1]-a[1]);if(Math.abs(d)<1e-8)return;let m00=((B[0]-A[0])*(c[1]-a[1])-(C[0]-A[0])*(b[1]-a[1]))/d,m01=((C[0]-A[0])*(b[0]-a[0])-(B[0]-A[0])*(c[0]-a[0]))/d,m10=((B[1]-A[1])*(c[1]-a[1])-(C[1]-A[1])*(b[1]-a[1]))/d,m11=((C[1]-A[1])*(b[0]-a[0])-(B[1]-A[1])*(c[0]-a[0]))/d;ctx.save();ctx.beginPath();ctx.moveTo(...A.slice(0,2));ctx.lineTo(...B.slice(0,2));ctx.lineTo(...C.slice(0,2));ctx.closePath();ctx.clip();ctx.transform(m00,m10,m01,m11,A[0]-m00*a[0]-m01*a[1],A[1]-m10*a[0]-m11*a[1]);ctx.drawImage(img,0,0);ctx.restore()}
function model(cam){let fs=DATA.faces.filter(f=>dot(cross(sub(f.p[1],f.p[0]),sub(f.p[2],f.p[0])),cam.cam)>0).sort((a,b)=>dot(a.p[0],cam.cam)-dot(b.p[0],cam.cam));for(let f of fs){let p=f.p.map(cam.p);tri(images[f.tex],[p[0],p[1],p[2]],[f.uv[0],f.uv[1],f.uv[2]]);tri(images[f.tex],[p[0],p[2],p[3]],[f.uv[0],f.uv[2],f.uv[3]])}}
function ring(cam,t,r,tilt,color,opacity){let points=[];for(let i=0;i<=80;i++){let a=i*Math.PI/40+t;points.push(cam.p([Math.cos(a)*r,Math.sin(a)*r*Math.sin(tilt),Math.sin(a)*r*Math.cos(tilt)]))}ctx.save();ctx.strokeStyle=color;ctx.globalAlpha=opacity;ctx.shadowColor=color;ctx.shadowBlur=8;ctx.lineWidth=1.5;ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();ctx.restore()}
function field(cam,t){sprite(cam,'halo',[0,0,0],2.65,3.05,'#5550ee',.16+.04*Math.sin(t*6));ring(cam,t*2,1.18,1.05,'#54efff',.5);ring(cam,-t*2.7,1.03,-.94,'#b06bff',.4);for(let i=0;i<8;i++){let a=i*6.28/8+t*2.7,p=[Math.cos(a)*1.08,Math.sin(a*2+i)*.62,Math.sin(a)*1.08];sprite(cam,'debris',p,.22,.32,'#718ac7',.9,a);if(i%2===0)sprite(cam,'star',p,.1,.16,'#81eaff',.8)}model(cam);sprite(cam,'fissure',[0,0,0],.9,2.85,'#18cfff',.32);sprite(cam,'fissure',[0,0,0],.42,2.6,'#dbffff',.9);for(let i=0;i<10;i++){let a=i*6.28/10+t*3,p=[Math.cos(a)*1.05,Math.sin(a*2)*.42,Math.sin(a)*1.05],q=cam.p(p),v=cam.p([p[0]-.1*Math.sin(a),p[1],p[2]+.1*Math.cos(a)]);sprite(cam,'fissure',p,.24,.8,i%2?'#70baff':'#adffff',.50,Math.atan2(v[1]-q[1],v[0]-q[0])-Math.PI/2)}for(let i=0;i<22;i++){let age=(t*1.7+i*.173)%1,a=i*2.399,dir=[Math.cos(a),Math.sin(a*1.7),Math.sin(a)],p=dir.map(v=>v*age*.9);p[1]+=Math.sin(i)*.7;let q=cam.p(p),v=cam.p(p.map((v,j)=>v+dir[j]*.1));sprite(cam,'spark',p,.06,.38,'#b1ffff',(1-age)*.75,Math.atan2(v[1]-q[1],v[0]-q[0])-Math.PI/2)}sprite(cam,'star',[Math.sin(t*18)*.1,Math.sin(t*9)*.9,0],.3,.3,'#e6ffff',.65)}
function javaRandom(seed){let s=(BigInt(seed)^0x5deece66dn)&((1n<<48n)-1n);const next=n=>{s=(s*0x5deece66dn+11n)&((1n<<48n)-1n);return Number(s>>(48n-BigInt(n)))};return()=>((next(26)*134217728)+next(27))/9007199254740992}
function arc(frame){let from=[-3,0,0],to=[3,.75,0],axis=norm(sub(to,from)),side=norm(cross(axis,[0,1,0])),up=norm(cross(side,axis)),steps=Math.ceil(Math.hypot(...sub(to,from))/.23),rnd=javaRandom(0x534d524946544cn+BigInt(frame)*31n),points=[];for(let i=0;i<=steps;i++){let t=i/steps,e=Math.sin(Math.PI*t),a=(Math.sin(t*21+frame)*.19+(rnd()-.5)*.28)*e,b=(Math.cos(t*17-frame)*.15+(rnd()-.5)*.2)*e;points.push(from.map((v,j)=>v+(to[j]-v)*t+a*side[j]+b*up[j]))}return points}
function link(cam,t,title){ctx.fillStyle='#b6d0ec';ctx.font='17px system-ui';ctx.fillText(title,690,cam.p([0,0,0])[1]-100);let points=arc(Math.floor(t*4));for(let i=1;i<points.length;i++){let a=points[i-1],b=points[i],m=a.map((v,j)=>(v+b[j])/2),len=Math.hypot(...sub(b,a)),p=cam.p(a),q=cam.p(b),angle=Math.atan2(q[1]-p[1],q[0]-p[0])-Math.PI/2;let projected=Math.hypot(q[0]-p[0],q[1]-p[1])/cam.scale;for(let s of DATA.linkStyles)sprite(cam,'fissure',m,len*s.width,projected*s.height,s.color,s.opacity,angle)}for(let [i,p]of [[0,points[0]],[1,points.at(-1)]]){sprite(cam,'star',p,.35,.35,i?'#c4ffff':'#8760ff',.9);let q=cam.p(p);ctx.fillStyle='#7891af';ctx.font='13px system-ui';ctx.fillText(i?'Stabilizer':'Rift',q[0]-22,q[1]+32)}}
let run=true,time=0,last=0;document.getElementById('play').onclick=()=>{run=!run;document.getElementById('play').textContent=run?'Pause motion':'Play motion'};
function draw(now){if(last&&run)time+=(now-last)/1000;last=now;ctx.clearRect(0,0,1200,690);ctx.fillStyle='#0b1425';ctx.fillRect(0,0,1200,690);ctx.strokeStyle='#14243b';ctx.lineWidth=1;for(let x=20;x<1200;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,690);ctx.stroke()}for(let y=10;y<690;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(1200,y);ctx.stroke()}ctx.fillStyle='#7290b5';ctx.font='16px system-ui';ctx.fillText('Fractured electric core',28,36);ctx.fillText('World aligned stabilizer link',675,36);let yaw=Number(document.getElementById('angle').value)*Math.PI/180+time*.16,cam=camera(yaw,.13,320,325,157);if(document.getElementById('vfx').checked)field(cam,time);else model(cam);link(camera(.12,.07,925,175,63),time,'Side view');link(camera(.65,.66,925,425,63),time,'Raised camera view');ctx.fillStyle='#58d7e6';ctx.font='15px system-ui';ctx.fillText('64 particles in each one second field pulse',36,638);ctx.fillStyle='#8da4c1';ctx.fillText('Existing core UVs and all painted textures preserved',36,665);ctx.fillText('2 finite particles in each directed segment',700,638);requestAnimationFrame(draw)}
Promise.all(Object.entries(DATA.images).map(([k,v])=>new Promise(resolve=>{let i=new Image();i.onload=()=>{images[k]=i;resolve()};i.src=v}))).then(()=>requestAnimationFrame(draw));
</script></html>
